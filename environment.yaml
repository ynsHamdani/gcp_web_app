name: gcp-web
channels:
  - conda-forge

dependencies:
  - python=3.12

  # Geospatial core
  - geopandas
  - rasterio
  - shapely
  - pyproj
  - pyogrio

  # Database
  - sqlalchemy
  - psycopg

  # Install remaining Python packages with pip
  - pip
  - pip:
      - dash
      - dash-leaflet
      - Flask-Login
      - Flask-WTF
      - gunicorn
      - rio-cogeo
      - python-dotenv
      - requests