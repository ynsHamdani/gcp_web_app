<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password · GCP application</title>
  <style>
    body{margin:0;background:#f4f6fa;font-family:Arial,sans-serif;color:#172033}
    .card{max-width:440px;margin:8vh auto;padding:28px;background:#fff;border:1px solid #dbe2ea;border-radius:12px;box-shadow:0 8px 30px #0f172a10}
    label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
    input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px}
    button{margin-top:18px;background:#1d4ed8;color:#fff;border:0;border-radius:7px;padding:11px 16px;font-weight:600;cursor:pointer}
    .notice{background:#eff6ff;border-radius:8px;padding:10px;font-size:13px;color:#1e40af}
    .error{color:#b91c1c;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <h2>Choose a new password</h2>
    {% if must_change %}<p class="notice">This account uses a temporary password. You must choose a new password before opening the application.</p>{% endif %}
    <p>Use at least 12 characters. Avoid reusing a password from another service.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="current_password">Current or temporary password</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" minlength="12" autocomplete="new-password" required>
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
      <button type="submit">Save new password</button>
    </form>
  </main>
</body>
</html>
